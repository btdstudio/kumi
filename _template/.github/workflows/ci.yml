name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goph_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/goph_test?sslmode=disable
      SECRET_KEY: test-secret-do-not-use-in-production
      RESEND_API_KEY: re_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate templ views
        run: templ generate

      - name: Check format
        run: |
          gofmt -l -e . > /tmp/gofmt.txt
          if [ -s /tmp/gofmt.txt ]; then
            echo "Files not formatted:"
            cat /tmp/gofmt.txt
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir migrations postgres "$DATABASE_URL" up

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o /dev/null ./cmd/server/
