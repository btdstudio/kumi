name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Check format
        run: |
          gofmt -l -e ./cmd/ ./internal/ > /tmp/gofmt.txt
          if [ -s /tmp/gofmt.txt ]; then
            echo "Files not formatted:"
            cat /tmp/gofmt.txt
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
